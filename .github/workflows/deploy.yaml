# This is a basic workflow to help you get started with Actions

name: OpenStack Service Deployment

# Controls when the workflow will run
on:
  push:
    branches: [master]
    paths:
      - '!.github/**'
      - 'k8s/**/*.tf*'
      - 'vms/**/*.tf*'
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      services:
        description: 'Space-separated services, e.g. "k8s vms"'
        required: true

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  prepare:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    # For comments: PRs only, ".redeploy" prefix, trusted authors only
    if: >
      github.event_name != 'issue_comment' ||
      (github.event.issue.pull_request &&
       startsWith(github.event.comment.body, '.redeploy') &&
       contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'),
                github.event.comment.author_association))
    outputs:
      services: ${{ steps.svc.outputs.services }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve services to deploy
        id: svc
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          COMMENT_BODY: ${{ github.event.comment.body }}
          PR_NUMBER: ${{ github.event.issue.number }}
          INPUT_SERVICES: ${{ inputs.services }}
        run: |
          set -euo pipefail

          case "$EVENT" in
            push)
              services=$(git diff --name-only "$BEFORE" "$GITHUB_SHA" )
              ;;
            issue_comment)
              state=$(gh pr view "$PR_NUMBER" --json state -q .state)
              if [ "$state" != "MERGED" ]; then
                echo "::error::PR #$PR_NUMBER is not merged, nothing to redeploy"
                exit 1
              fi
              # ".redeploy nova neutron" -> explicit list; plain ".redeploy" -> PR's changed services
              explicit=$(head -n1 <<<"$COMMENT_BODY" | tr -d '\r' | sed -E 's/^\.redeploy[[:space:]]*//')
              if [ -n "$explicit" ]; then
                services=$(tr -s ' ,' '\n' <<<"$explicit")
              else
                services=$(gh pr diff "$PR_NUMBER" --name-only )
              fi
              ;;
            workflow_dispatch)
              services=$(tr -s ' ,' '\n' <<<"$INPUT_SERVICES")
              ;;
          esac

          services=$(grep -v '^$' <<<"$services" | sort -u || true)

          if grep -qvE '^[a-z0-9-]+$' <<<"$services"; then
            echo "::error::Invalid service name in: $services"
            exit 1
          fi

          json=$(jq -R -s -c 'split("\n") | map(select(length>0))' <<<"$services")
          echo "services=$json" >> "$GITHUB_OUTPUT"
          echo "Services to deploy: $json" | tee -a "$GITHUB_STEP_SUMMARY"

  deploy:
    needs: prepare
    if: needs.prepare.outputs.services != '[]'
    runs-on: ubuntu-latest
    environment: Prod
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        service: ${{ fromJSON(needs.prepare.outputs.services) }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup OpenTofu
        uses: opentofu/setup-opentofu@v2
        with:
          tofu_version: 1.9.0 

      - name: Install WireGuard
        run: sudo apt-get update && sudo apt-get install -y wireguard resolvconf curl jq

      - name: Connect VPN
        env:
          WG_CONFIG: ${{ secrets.WG_CONFIG }}
        run: |
          printf '%s\n' "$WG_CONFIG" | sudo tee /etc/wireguard/wg0.conf > /dev/null
          sudo chmod 600 /etc/wireguard/wg0.conf
          sudo wg-quick up wg0

      # Check VPN connection
      - name: Check keystone endpoint
        shell: bash
        run: |
          curl -k https://keystone.ctl1-humanz.cloud 

      # Install Helm
      - name: Install helm 
        shell: bash
        run: |
          curl https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | sudo bash

      # Drop kubeconfig
      - name: Create kubeconfig
        run: |
          mkdir -p ${HOME}/.kube
          echo ${{ secrets.KUBE_CONFIG }} | base64 --decode > ${HOME}/.kube/config

      # Create openstackrc file
      - name: Create openstackrc file from keystone helm chart
        run: |
          export OS_PASSWORD=$(helm -n openstack get values keystone -o json | jq -r ".endpoints.identity.auth.admin.password")
          export OS_AUTH=$(helm -n openstack get values keystone -o json | jq -r ".endpoints.identity.scheme.public")://$(helm -n openstack get values keystone -o json | jq -r ".endpoints.identity.host_fqdn_override.public.host")/v3
          export OS_REGION=$(helm -n openstack get values keystone -o json | jq -r ".endpoints.identity.auth.admin.region_name")
          
          cat <<EOF > "${HOME}/.config/openstack/clouds.yaml"
          clouds:
            openstack:
              auth:
                auth_url: ${OS_AUTH}
                username: "admin"
                password: ${OS_PASSWORD}
                project_name: "admin"
                user_domain_name: "Default"
                project_domain_name: Default
              region_name: "${OS_REGION}"
              interface: "publicURL"
              identity_api_version: 3
              verify: False
          EOF

      - name: Deploy ${{ matrix.service }}
        env:
          SERVICE: ${{ matrix.service }}
          TF_VAR_rustfs_secret_key: ${{ secrets.RUSTFS_SECRET }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: |
          cd "$SERVICE"
          chmod +x deploy.sh
          ./deploy.sh

      - name: Cleanup
        if: always()
        run: |
          sudo wg-quick down wg0 || true
          sudo rm -f /etc/wireguard/wg0.conf
          rm -f "$HOME/.kube/config"
          rm -f /tmp/clouds.yaml